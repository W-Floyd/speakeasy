## Speakeasy Snapcast mDNS IPv6 WiFi 9dBm - Edit the settings below.
substitutions:
  name: sc-mdns-6-w9
  friendly_name: Speakeasy Snapcast mDNS IPv6 WiFi 9dBm

packages:
  - !include common/base.yaml
  - !include common/snapcast-audio.yaml
  - !include common/ipv6.yaml
  - !include common/wifi-9.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-sc-mdns-6-w9.yaml@main
  import_full_config: false

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

media_player:
  - id: !extend snapclient_media_player
    hostname: !remove
    port: !remove
