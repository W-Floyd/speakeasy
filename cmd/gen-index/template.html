<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speakeasy Firmware</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    p.subtitle { color: #666; margin-top: 0; margin-bottom: 2rem; }

    .question { margin-bottom: 1.25rem; }
    .question-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #999; margin-bottom: 0.5rem; }
    .options { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .option input[type=radio] { position: absolute; opacity: 0; width: 0; height: 0; }
    .option label {
      display: block; padding: 0.45rem 0.9rem; border: 1.5px solid #ddd;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem; user-select: none;
      transition: border-color 0.1s;
    }
    .option label small { color: #999; font-size: 0.78em; display: block; margin-top: 1px; }
    .option input[type=radio]:checked + label { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
    .option input[type=radio]:checked + label small { color: #60a5fa; }
    .option label:hover { border-color: #999; }

    #q-server { display: none; }

    .flash-area { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #eee; display: flex; align-items: center; gap: 1rem; }
    #variant-name { font-family: monospace; font-size: 0.82rem; color: #666; }
    #unavailable-msg { font-size: 0.85rem; color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Speakeasy</h1>
  <p class="subtitle">ESP32-S3 multi-room audio firmware. Plug in via USB and flash below. Requires Chrome or Edge.</p>

  <div class="question">
    <div class="question-label">Protocol</div>
    <div class="options">
      <div class="option">
        <input type="radio" name="proto" id="proto-sendspin" value="sendspin" checked>
        <label for="proto-sendspin">Sendspin<small>Music Assistant</small></label>
      </div>
      <div class="option">
        <input type="radio" name="proto" id="proto-snapcast" value="snapcast">
        <label for="proto-snapcast">Snapcast</label>
      </div>
    </div>
  </div>

  <div class="question" id="q-server">
    <div class="question-label">Snapcast Server</div>
    <div class="options">
      <div class="option">
        <input type="radio" name="server" id="server-static" value="static" checked>
        <label for="server-static">Static IP</label>
      </div>
      <div class="option">
        <input type="radio" name="server" id="server-mdns" value="mdns">
        <label for="server-mdns">mDNS Discovery</label>
      </div>
    </div>
  </div>

  <div class="question">
    <div class="question-label">Bluetooth</div>
    <div class="options">
      <div class="option">
        <input type="radio" name="nobt" id="nobt-off" value="off" checked>
        <label for="nobt-off">Enabled<small>WiFi setup via BLE</small></label>
      </div>
      <div class="option">
        <input type="radio" name="nobt" id="nobt-on" value="on">
        <label for="nobt-on">Disabled<small>saves memory</small></label>
      </div>
    </div>
  </div>

  <div class="question">
    <div class="question-label">IPv6</div>
    <div class="options">
      <div class="option">
        <input type="radio" name="ipv6" id="ipv6-off" value="off" checked>
        <label for="ipv6-off">Disabled</label>
      </div>
      <div class="option">
        <input type="radio" name="ipv6" id="ipv6-on" value="on">
        <label for="ipv6-on">Enabled</label>
      </div>
    </div>
  </div>

  <div class="question">
    <div class="question-label">Output</div>
    <div class="options">
      <div class="option">
        <input type="radio" name="twoch" id="twoch-off" value="off" checked>
        <label for="twoch-off">Single</label>
      </div>
      <div class="option">
        <input type="radio" name="twoch" id="twoch-on" value="on">
        <label for="twoch-on">Dual (2ch)</label>
      </div>
    </div>
  </div>

  <div class="flash-area">
    <esp-web-install-button id="install-btn" manifest="">
      <button slot="activate">Flash</button>
      <span slot="unsupported">Use Chrome or Edge</span>
      <span slot="not-allowed">Requires HTTPS</span>
    </esp-web-install-button>
    <span id="variant-name"></span>
    <span id="unavailable-msg"></span>
  </div>

  <p style="margin-top:2rem;font-size:0.8rem;color:#aaa;"><a href="https://github.com/W-Floyd/speakeasy">Source on GitHub</a>.</p>

  <script>
    const available = new Set([{{range .}}{{range .Items}}"{{.Manifest}}",{{end}}{{end}}]);

    const installBtn = document.getElementById('install-btn');
    const variantName = document.getElementById('variant-name');
    const unavailableMsg = document.getElementById('unavailable-msg');
    const qServer = document.getElementById('q-server');

    function buildManifest() {
      const proto = document.querySelector('input[name=proto]:checked').value;
      const mdns = proto === 'sendspin' || document.querySelector('input[name=server]:checked').value === 'mdns';
      const twoch = document.querySelector('input[name=twoch]:checked').value === 'on';
      const nobt = document.querySelector('input[name=nobt]:checked').value === 'on';
      const ipv6 = document.querySelector('input[name=ipv6]:checked').value === 'on';

      let name = 'speakeasy-' + proto;
      if (twoch) name += '-2ch';
      if (mdns) name += '-mdns';
      if (nobt) name += '-nobt';
      if (ipv6) name += '-ipv6';
      return name + '/manifest.json';
    }

    function update() {
      const proto = document.querySelector('input[name=proto]:checked').value;
      qServer.style.display = proto === 'snapcast' ? '' : 'none';

      const manifest = buildManifest();
      const stem = manifest.replace('/manifest.json', '');
      const exists = available.has(manifest);

      installBtn.setAttribute('manifest', manifest);
      variantName.textContent = stem;
      installBtn.style.display = exists ? '' : 'none';
      unavailableMsg.textContent = exists ? '' : 'Not available as a pre-built binary.';
    }

    document.querySelectorAll('input[type=radio]').forEach(r => r.addEventListener('change', update));
    update();
  </script>
</body>
</html>
