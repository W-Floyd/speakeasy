## Speakeasy Snapcast - Edit the settings below.
substitutions:
  name: sc
  friendly_name: Speakeasy Snapcast

  # Snapcast server address and port
  snapcast_server_ip: "192.168.1.1"
  snapcast_server_port: "1704"

packages:
  - !include common/base.yaml
  - !include common/snapcast-audio.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-sc.yaml@main
  import_full_config: false

esp32:
  variant: esp32s3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
