## Speakeasy OTS Snapcast - Edit the settings below.
substitutions:
  name: ots-sc
  friendly_name: Speakeasy OTS Snapcast

packages:
  - !include common/base.yaml
  - !include common/snapcast-audio.yaml
  - !include common/wifi-ramp.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-ots-sc.yaml@main
  import_full_config: false

esp32:
  variant: esp32s3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

media_player:
  - id: !extend snapclient_media_player
    hostname: !remove
    port: !remove
