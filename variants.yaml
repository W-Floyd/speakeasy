# Variants to build in CI (GitHub Actions)
ci:
  - ots-ss
  - ots-ss-bt
  - ots-sc
  - ots-sc-bt
  - pcb-ss
  - pcb-ss-bt
  - pcb-sc
  - pcb-sc-bt

# Snapclient (CarlosDerSeher) standalone ESP-IDF builds
# Requires: git submodule add https://github.com/CarlosDerSeher/snapclient snapclient
snapclient-ci:
  - ots
  - ots-nopull
  - pcb
  - pcb-nopull
