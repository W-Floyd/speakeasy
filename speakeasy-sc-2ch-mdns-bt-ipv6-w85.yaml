## Speakeasy Snapcast 2ch mDNS Bluetooth IPv6 WiFi 8.5dBm - Edit the settings below.
substitutions:
  name: sc-2ch-mdns-bt-ipv6-w85
  friendly_name: Speakeasy Snapcast 2ch mDNS Bluetooth IPv6 WiFi 8.5dBm

packages:
  - !include common/base.yaml
  - !include common/improv.yaml
  - !include common/snapcast-audio.yaml
  - !include common/second-speaker.yaml
  - !include common/ipv6.yaml
  - !include common/wifi-85.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-sc-2ch-mdns-bt-ipv6-w85.yaml@main
  import_full_config: false

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

media_player:
  - id: !extend snapclient_media_player
    hostname: !remove
    port: !remove
