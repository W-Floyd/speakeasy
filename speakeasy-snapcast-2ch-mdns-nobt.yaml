## Speakeasy Snapcast 2ch mDNS No Bluetooth - Edit the settings below.
substitutions:
  name: snapcast-2ch-mdns-nobt
  friendly_name: Speakeasy Snapcast 2ch mDNS No Bluetooth

packages:
  - !include common/base.yaml
  - !include common/snapcast-audio.yaml
  - !include common/second-speaker.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-snapcast-2ch-mdns-nobt.yaml@main
  import_full_config: false

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

media_player:
  - id: !extend snapclient_media_player
    hostname: !remove
    port: !remove
