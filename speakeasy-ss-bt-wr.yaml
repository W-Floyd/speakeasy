## Speakeasy Sendspin Bluetooth WiFi Stock Ramp - Edit the settings below.
substitutions:
  name: ss-bt-wr
  friendly_name: Speakeasy Sendspin Bluetooth WiFi Stock Ramp

packages:
  - !include common/base.yaml
  - !include common/improv.yaml
  - !include common/sendspin-audio.yaml
  - !include common/wifi-ramp.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-ss-bt-wr.yaml@main
  import_full_config: false

esp32:
  variant: esp32s3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
