## Speakeasy (Snapcast mDNS) - Edit the settings below.
substitutions:
  name: speakeasy-snapcast-m
  friendly_name: Speakeasy Snapcast mDNS

packages:
  - !include speakeasy-snapcast.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-snapcast-mdns.yaml@main
  import_full_config: false

media_player:
  - id: !extend snapclient_media_player
    hostname: !remove
    port: !remove
