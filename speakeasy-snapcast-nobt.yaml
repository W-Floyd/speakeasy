## Speakeasy Snapcast No Bluetooth - Edit the settings below.
substitutions:
  name: snapcast-nobt
  friendly_name: Speakeasy Snapcast No Bluetooth

  # Snapcast server address and port
  snapcast_server_ip: "192.168.1.1"
  snapcast_server_port: "1704"

packages:
  - !include common/base.yaml
  - !include common/snapcast-audio.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-snapcast-nobt.yaml@main
  import_full_config: false

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
