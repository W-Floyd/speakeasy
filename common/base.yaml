substitutions:
  wifi_output_power: "8.5"

  i2s_lrclk_pin: GPIO6
  i2s_bclk_pin: GPIO5
  i2s_dout_pin: GPIO4

esphome:
  min_version: 2026.5.0
  name_add_mac_suffix: true
  project:
    name: w_floyd.speakeasy
    version: "2026.5.0"
  includes:
    - <esp_wifi.h>
  on_boot:
    priority: -100
    then:
      - delay: 30s
      - lambda: id(wifi_ramp_armed) = true;

globals:
  - id: wifi_ramp_armed
    type: bool
    restore_value: false
    initial_value: 'false'

esp32:
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  level: info

api:

ota:
  - platform: esphome

wifi:
  id: wifi_component
  power_save_mode: none
  output_power: ${wifi_output_power}
  post_connect_roaming: false
  ap:
  on_connect:
    - lambda: |-
        char ip_buf[esphome::network::IP_ADDRESS_BUFFER_SIZE];
        id(wifi_component).get_ip_addresses()[0].str_to(ip_buf);
        ESP_LOGW("speakeasy", "IP: %s, RSSI: %d dBm", ip_buf, id(wifi_component).wifi_rssi());
  on_disconnect:
    - lambda: |-
        float current = id(wifi_tx_power).state;
        if (current < 8.5f) {
          float next = std::min(current + 0.25f, 8.5f);
          auto call = id(wifi_tx_power).make_call();
          call.set_value(next);
          call.perform();
          ESP_LOGW("speakeasy", "WiFi dropped — TX power stepped %.2f → %.2f dBm", current, next);
        }

network:
  enable_ipv6: true

improv_serial:

esp32_improv:
  authorizer: none

psram:
  mode: quad
  speed: 80MHz

captive_portal:

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: ${i2s_lrclk_pin}
    i2s_bclk_pin: ${i2s_bclk_pin}

number:
  - platform: template
    name: WiFi TX Power
    id: wifi_tx_power
    icon: mdi:wifi-strength-2
    entity_category: config
    unit_of_measurement: dBm
    min_value: 2.0
    max_value: 20.5
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: ${wifi_output_power}
    set_action:
      - lambda: |-
          esp_wifi_set_max_tx_power((int8_t)(x * 4));
          ESP_LOGW("speakeasy", "WiFi TX power set to %.2f dBm", x);

interval:
  - interval: 30s
    then:
      - lambda: |-
          if (id(wifi_ramp_armed) && !id(wifi_component).is_connected()) {
            float current = id(wifi_tx_power).state;
            if (current < 8.5f) {
              float next = std::min(current + 0.25f, 8.5f);
              auto call = id(wifi_tx_power).make_call();
              call.set_value(next);
              call.perform();
              ESP_LOGW("speakeasy", "WiFi still down — TX power stepped %.2f → %.2f dBm", current, next);
            }
          }
