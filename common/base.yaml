# Default (OTS) pinout — matches the Speakeasy Lowcost PCB, which wires an
# off-the-shelf ESP32-S3 Supermini to a MAX98357A breakout.
# See pcb/speakeasy/circuit-synth-lowcost/board_def.py.
# Note: LRCLK/DOUT are swapped relative to the custom PCB variant.
substitutions:
  i2s_lrclk_pin: GPIO4
  i2s_bclk_pin: GPIO5
  i2s_dout_pin: GPIO6

esphome:
  min_version: 2026.5.0
  name_add_mac_suffix: true
  project:
    name: w_floyd.speakeasy
    version: "1"

esp32:
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      # Options: 0=NONE, 1=ERROR, 2=WARN, 3=INFO, 4=DEBUG, 5=VERBOSE
      CONFIG_LOG_DEFAULT_LEVEL: "4"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH: "n"
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: "y"
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: "y"
      CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM: "16"
      CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM: "64"
      # WiFi IRAM — required for quad PSRAM (not auto-mapped unlike octal)
      CONFIG_ESP_WIFI_IRAM_OPT: "y"
      CONFIG_ESP_WIFI_RX_IRAM_OPT: "y"
      CONFIG_ESP_WIFI_EXTRA_IRAM_OPT: "y"
      # WiFi buffers / AMPDU
      CONFIG_ESP_WIFI_CACHE_TX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_MGMT_SBUF_NUM: "32"
      CONFIG_ESP_WIFI_TX_BA_WIN: "8"
      CONFIG_ESP_WIFI_RX_BA_WIN: "16"
      # I2S ISR in IRAM — keeps audio safe during OTA/NVS flash writes
      CONFIG_I2S_ISR_IRAM_SAFE: "y"
      # LwIP — pin to core 0, IRAM paths, larger TCP windows
      CONFIG_LWIP_TCPIP_TASK_AFFINITY_CPU0: "y"
      CONFIG_LWIP_IRAM_OPTIMIZATION: "y"
      CONFIG_LWIP_EXTRA_IRAM_OPTIMIZATION: "y"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "11520"
      CONFIG_LWIP_TCP_WND_DEFAULT: "11520"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "16"
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS: "8"
      CONFIG_LWIP_TCP_SACK_OUT: "y"
      # Compiler performance optimization
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"

logger:
  level: debug

api:

ota:
  - platform: esphome

wifi:
  id: wifi_component
  power_save_mode: none
  post_connect_roaming: false
  ap:
  on_connect:
    - lambda: |-
        char ip_buf[esphome::network::IP_ADDRESS_BUFFER_SIZE];
        id(wifi_component).get_ip_addresses()[0].str_to(ip_buf);
        ESP_LOGW("speakeasy", "IP: %s, RSSI: %d dBm", ip_buf, id(wifi_component).wifi_rssi());

network:
  enable_ipv6: true
  enable_high_performance: true

psram:
  mode: quad
  speed: 80MHz

captive_portal:

improv_serial:

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: ${i2s_lrclk_pin}
    i2s_bclk_pin: ${i2s_bclk_pin}

sensor:
  - platform: internal_temperature
    name: Internal Temperature
