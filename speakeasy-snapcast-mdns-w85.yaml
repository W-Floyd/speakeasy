## Speakeasy Snapcast mDNS WiFi 8.5dBm - Edit the settings below.
substitutions:
  name: snapcast-mdns-w85
  friendly_name: Speakeasy Snapcast mDNS WiFi 8.5dBm

packages:
  - !include common/base.yaml
  - !include common/improv.yaml
  - !include common/snapcast-audio.yaml
  - !include common/wifi-85.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-snapcast-mdns-w85.yaml@main
  import_full_config: false

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

media_player:
  - id: !extend snapclient_media_player
    hostname: !remove
    port: !remove
