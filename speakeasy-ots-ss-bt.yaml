## Speakeasy OTS Sendspin Bluetooth - Edit the settings below.
substitutions:
  name: ots-ss-bt
  friendly_name: Speakeasy OTS Sendspin Bluetooth

packages:
  - !include common/base.yaml
  - !include common/improv.yaml
  - !include common/sendspin-audio.yaml
  - !include common/wifi-ramp.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-ots-ss-bt.yaml@main
  import_full_config: false

esp32:
  variant: esp32s3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
