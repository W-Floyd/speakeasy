## Speakeasy Snapcast Bluetooth IPv6 WiFi Stock Ramp - Edit the settings below.
substitutions:
  name: sc-bt-6-wr
  friendly_name: Speakeasy Snapcast Bluetooth IPv6 WiFi Stock Ramp

packages:
  - !include common/base.yaml
  - !include common/improv.yaml
  - !include common/snapcast-audio.yaml
  - !include common/ipv6.yaml
  - !include common/wifi-ramp.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-sc-bt-6-wr.yaml@main
  import_full_config: false

esp32:
  variant: esp32s3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

media_player:
  - id: !extend snapclient_media_player
    hostname: !remove
    port: !remove
