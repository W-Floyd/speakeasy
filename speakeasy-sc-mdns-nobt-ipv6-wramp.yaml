## Speakeasy Snapcast mDNS No Bluetooth IPv6 WiFi Ramp - Edit the settings below.
substitutions:
  name: sc-mdns-nobt-ipv6-wramp
  friendly_name: Speakeasy Snapcast mDNS No Bluetooth IPv6 WiFi Ramp

packages:
  - !include common/base.yaml
  - !include common/snapcast-audio.yaml
  - !include common/ipv6.yaml
  - !include common/wifi-ramp.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-sc-mdns-nobt-ipv6-wramp.yaml@main
  import_full_config: false

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

media_player:
  - id: !extend snapclient_media_player
    hostname: !remove
    port: !remove
