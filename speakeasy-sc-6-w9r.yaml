## Speakeasy Snapcast IPv6 WiFi 9dBm Ramp - Edit the settings below.
substitutions:
  name: sc-6-w9r
  friendly_name: Speakeasy Snapcast IPv6 WiFi 9dBm Ramp

  # Snapcast server address and port
  snapcast_server_ip: "192.168.1.1"
  snapcast_server_port: "1704"

packages:
  - !include common/base.yaml
  - !include common/snapcast-audio.yaml
  - !include common/ipv6.yaml
  - !include common/wifi-9ramp.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-sc-6-w9r.yaml@main
  import_full_config: false

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
