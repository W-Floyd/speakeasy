## Speakeasy Sendspin - Edit the settings below.
substitutions:
  name: ss
  friendly_name: Speakeasy Sendspin

packages:
  - !include common/base.yaml
  - !include common/sendspin-audio.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-ss.yaml@main
  import_full_config: false

esp32:
  variant: esp32s3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
