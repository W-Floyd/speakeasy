## Speakeasy Snapcast Bluetooth WiFi Stock Ramp - Edit the settings below.
substitutions:
  name: sc-bt-wr
  friendly_name: Speakeasy Snapcast Bluetooth WiFi Stock Ramp

  # Snapcast server address and port
  snapcast_server_ip: "192.168.1.1"
  snapcast_server_port: "1704"

packages:
  - !include common/base.yaml
  - !include common/improv.yaml
  - !include common/snapcast-audio.yaml
  - !include common/wifi-ramp.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-sc-bt-wr.yaml@main
  import_full_config: false

esp32:
  variant: esp32s3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
