## Speakeasy PCB Snapcast Bluetooth - Edit the settings below.
substitutions:
  name: pcb-sc-bt
  friendly_name: Speakeasy PCB Snapcast Bluetooth
  i2s_bclk_pin: GPIO5
  i2s_lrclk_pin: GPIO6
  i2s_dout_pin: GPIO4

packages:
  - !include common/base.yaml
  - !include common/improv.yaml
  - !include common/snapcast-audio.yaml
  - !include common/wifi-ramp.yaml

dashboard_import:
  package_import_url: github://W-Floyd/speakeasy/speakeasy-pcb-sc-bt.yaml@main
  import_full_config: false

esp32:
  variant: esp32s3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

media_player:
  - id: !extend snapclient_media_player
    hostname: !remove
    port: !remove
